[package]
name = "ex_inmemory"
version = "0.1.0"
authors = ["benerjo <benerjo@gmail.com>"]
edition = "2021"
build = "build/build.rs"


[build-dependencies]
bdmg2k = { path = "../bdmg2k" }

[dependencies]
bdmg = { path = "../bdmg" }
diesel = { version = "2.1.3", features = ["sqlite", "numeric", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2.1.0", features = ["sqlite"] }
serde = "1.0"
serde_derive = "1.0"